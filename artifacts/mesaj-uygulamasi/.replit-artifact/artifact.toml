kind = "web"
previewPath = "/"
title = "Mesaj Uygulaması"
version = "1.0.0"
id = "artifacts/mesaj-uygulamasi"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20796

[services.development]
run = "pnpm --filter @workspace/mesaj-uygulamasi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mesaj-uygulamasi", "run", "build" ]
publicDir = "artifacts/mesaj-uygulamasi/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20796"
BASE_PATH = "/"
